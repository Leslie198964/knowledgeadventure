<!DOCTYPE html>
<html lang="zh-Hant" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知識大冒險 - 課堂地圖大富翁 Knowledge Adventure</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
    }

    .dice-scene {
      width: 80px;
      height: 80px;
      perspective: 400px;
    }
    .dice {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s ease-out;
    }
    .dice-face {
      position: absolute;
      width: 80px;
      height: 80px;
      background: linear-gradient(145deg, #ffffff, #f0f0f0);
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.3);
    }
    .dot {
      background-color: #1e293b;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
      width: 12px;
      height: 12px;
    }
    .dot.red { background-color: #ef4444; }

    /* Dice Face Rotations */
    .face-1 { transform: rotateY(0deg) translateZ(40px); }
    .face-2 { transform: rotateY(90deg) translateZ(40px); }
    .face-3 { transform: rotateY(180deg) translateZ(40px); }
    .face-4 { transform: rotateY(-90deg) translateZ(40px); }
    .face-5 { transform: rotateX(90deg) translateZ(40px); }
    .face-6 { transform: rotateX(-90deg) translateZ(40px); }

    /* Glowing map tile highlight */
    .active-tile {
      animation: pulse-ring 1.5s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0px rgba(245, 158, 11, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0px rgba(245, 158, 11, 0); }
    }

    /* Player Pawn bounce animation */
    .pawn-anim {
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-900 text-slate-100 overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Top Navigation Header -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-30 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="bg-gradient-to-tr from-amber-500 to-indigo-600 p-2.5 rounded-2xl shadow-lg shadow-indigo-500/20">
        <i data-lucide="map" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-amber-300 via-indigo-300 to-purple-300 bg-clip-text text-transparent">
          知識大冒險 <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-700 text-amber-400 border border-amber-500/30">Classroom Edition</span>
        </h1>
        <p class="text-xs text-slate-400">互動式地圖課堂遊戲 · 趣味複習與闖關</p>
      </div>
    </div>

    <!-- Global Controls -->
    <div class="flex items-center space-x-2">
      <button id="soundToggleBtn" onclick="toggleAudio()" class="p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 transition flex items-center gap-1.5 text-sm font-medium" title="開啟/靜音 音效">
        <i data-lucide="volume-2" id="soundIcon" class="w-4 h-4 text-emerald-400"></i>
        <span class="hidden sm:inline">音效</span>
      </button>
      <button onclick="openQuestionEditor()" class="p-2 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 transition flex items-center gap-1.5 text-sm font-medium" title="題庫管理">
        <i data-lucide="book-open" class="w-4 h-4 text-indigo-400"></i>
        <span class="hidden sm:inline">編輯題庫</span>
      </button>
      <button onclick="restartGameConfirm()" class="p-2 rounded-xl bg-rose-600/80 hover:bg-rose-600 text-white transition flex items-center gap-1.5 text-sm font-medium shadow-md shadow-rose-900/30">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        <span class="hidden sm:inline">重新開始</span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 max-w-[1700px] w-full mx-auto">
    
    <!-- Left/Center: Game Map Grid Board (Spans 8 cols on large screens) -->
    <section class="lg:col-span-8 flex flex-col gap-4">
      
      <!-- Top Action Bar / Dice Controller -->
      <div class="bg-slate-800/90 border border-slate-700/70 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-xl relative overflow-hidden">
        <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Current Player Turn Display -->
        <div class="flex items-center space-x-4">
          <div id="turnBadge" class="p-3 rounded-2xl bg-slate-700/80 border border-slate-600 flex items-center gap-3">
            <div id="turnPawnColor" class="w-7 h-7 rounded-full shadow-md flex items-center justify-center font-bold text-slate-900 bg-amber-400">
              1
            </div>
            <div>
              <span class="text-xs text-slate-400 block uppercase font-bold tracking-wider">當前回合 Current Turn</span>
              <span id="turnTeamName" class="font-bold text-lg text-white">第一組 (Red)</span>
            </div>
          </div>
          <div id="gameStatusText" class="text-sm font-semibold text-amber-300 bg-amber-500/10 px-3 py-1.5 rounded-lg border border-amber-500/20 hidden sm:block">
            請點擊「擲骰子」開始移動！
          </div>
        </div>

        <!-- 3D Dice and Roll Button -->
        <div class="flex items-center space-x-6">
          <div class="dice-scene">
            <div id="dice" class="dice">
              <!-- Face 1 -->
              <div class="dice-face face-1"><div class="dot red col-start-2 row-start-2"></div></div>
              <!-- Face 2 -->
              <div class="dice-face face-2"><div class="dot col-start-1 row-start-1"></div><div class="dot col-start-3 row-start-3"></div></div>
              <!-- Face 3 -->
              <div class="dice-face face-3"><div class="dot col-start-1 row-start-1"></div><div class="dot col-start-2 row-start-2"></div><div class="dot col-start-3 row-start-3"></div></div>
              <!-- Face 4 -->

              <!-- Face 5 -->
              <div class="dice-face face-5"><div class="dot col-start-1 row-start-1"></div><div class="dot col-start-3 row-start-1"></div><div class="dot col-start-2 row-start-2"></div><div class="dot col-start-1 row-start-3"></div><div class="dot col-start-3 row-start-3"></div></div>
              <!-- Face 6 -->
              <div class="dice-face face-6"><div class="dot col-start-1 row-start-1"></div><div class="dot col-start-3 row-start-1"></div><div class="dot col-start-1 row-start-2"></div><div class="dot col-start-3 row-start-2"></div><div class="dot col-start-1 row-start-3"></div><div class="dot col-start-3 row-start-3"></div></div>
            </div>
          </div>

          <button id="rollDiceBtn" onclick="rollDice()" class="group relative px-6 py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 active:scale-95 text-slate-950 font-black text-lg tracking-wide shadow-lg shadow-amber-500/25 transition flex items-center gap-2">
            <i data-lucide="dices" class="w-6 h-6 group-hover:rotate-45 transition-transform duration-300"></i>

      </div>

      <!-- Interactive Board Map Canvas Container -->
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-3xl p-4 sm:p-6 shadow-2xl relative min-h-[500px] flex flex-col justify-center">
        <!-- Map Grid -->
        <div id="boardGrid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-7 gap-2.5 sm:gap-3.5 relative">
          <!-- Board Tiles will be generated dynamically here -->

      </div>

    </section>

    <!-- Right Sidebar: Leaderboard, Team Setup & Event Log (Spans 4 cols) -->
    <section class="lg:col-span-4 flex flex-col gap-4">
      
      <!-- Leaderboard / Team Status Card -->
      <div class="bg-slate-800/90 border border-slate-700/70 rounded-2xl p-5 shadow-xl flex flex-col h-full">

          <div class="flex items-center gap-2 text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">
            <i data-lucide="history" class="w-4 h-4"></i>
            <span>冒險歷程記錄 Game Log</span>
          </div>
          <div id="gameLog" class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-300 overflow-y-auto flex-1 max-h-[180px] space-y-1.5">
            <p class="text-slate-500 italic">遊戲開始！點擊「擲骰子」開啟挑戰...</p>

        </div>

      </div>

      </div>

      <!-- Multiple Choice Options Container -->
      <div id="modalOptionsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">

        <button id="modalConfirmBtn" onclick="closeQuestionModal()" class="hidden px-6 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 font-bold text-white transition flex items-center gap-2">

  <!-- TEAM SETUP MODAL -->

      <div class="flex justify-between items-center mb-5 border-b border-slate-700 pb-3">

          <span>設定參賽隊伍 Teams Setup</span>

      </div>

      <div class="space-y-4 mb-6">

            <input type="range" id="teamCountRange" min="2" max="6" value="4" oninput="updateTeamCountInput(this.value)" class="w-full accent-indigo-500">

          </div>
        </div>

        <div id="teamNameInputs" class="space-y-2 max-h-[220px] overflow-y-auto pr-1">

  <!-- QUESTION BANK EDITOR MODAL -->
  <div id="questionEditorModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl max-w-3xl w-full p-6 shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
        <div class="flex items-center gap-3">
          <i data-lucide="book-open" class="w-6 h-6 text-indigo-400"></i>
          <h3 class="text-xl font-bold text-white">題庫與地圖設置 Question Editor</h3>
        </div>
        <button onclick="closeQuestionEditor()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <!-- Preset Selector -->
      <div class="mb-4 flex items-center justify-between gap-4 bg-slate-900/60 p-3 rounded-2xl border border-slate-700/60">
        <label class="text-xs font-bold text-slate-300 flex items-center gap-1.5">

          <option value="science">自然科學 Science</option>
          <option value="history">歷史地理 History & Geo</option>
          <option value="english">生活英語 English</option>
        </select>
      </div>

      <!-- Questions List Scroll Area -->
      <div id="editorQuestionList" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4">
        <!-- Dynamically injected question edit forms -->
      </div>

      <div class="flex justify-end gap-3 border-t border-slate-700 pt-3">
        <button onclick="closeQuestionEditor()" class="px-5 py-2.5 rounded-xl bg-slate-700 text-slate-300 font-medium">關閉</button>
        <button onclick="saveCustomQuestions()" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold shadow-lg shadow-indigo-600/30">儲存變更 Save</button>
      </div>
    </div>
  </div>

  <!-- VICTORY MODAL -->
  <div id="victoryModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-lg flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 border border-amber-500/50 rounded-3xl max-w-md w-full p-8 text-center shadow-2xl relative overflow-hidden">
      <div class="absolute -top-12 -left-12 w-40 h-40 bg-amber-500/20 rounded-full blur-3xl pointer-events-none"></div>

      <p id="winnerTeamText" class="text-xl font-bold text-amber-300 mb-6">第一組 榮獲知識大冒險冠軍！</p>

      <div id="victoryScoresSummary" class="bg-slate-900/80 rounded-2xl p-4 mb-6 border border-slate-700/80 space-y-2 text-sm">
        <!-- Final scores summary injected -->
      </div>

      <button onclick="restartGame()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black text-lg shadow-lg shadow-amber-500/20 hover:from-amber-400 hover:to-amber-500 transition">
        再次挑戰 Play Again
      </button>
    </div>
  </div>

  <script>
    /* Web Audio API Sound Effects Engine */
    let audioCtx = null;
    let isSoundMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function toggleAudio() {
      isSoundMuted = !isSoundMuted;
      const soundIcon = document.getElementById('soundIcon');
      if (isSoundMuted) {
        soundIcon.setAttribute('data-lucide', 'volume-x');
        soundIcon.classList.remove('text-emerald-400');
        soundIcon.classList.add('text-rose-400');
      } else {
        soundIcon.setAttribute('data-lucide', 'volume-2');
        soundIcon.classList.remove('text-rose-400');
        soundIcon.classList.add('text-emerald-400');
      }
      lucide.createIcons();
    }

    function playSound(type) {
      if (isSoundMuted) return;
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;

      if (type === 'roll') {
        // Rolling dice click sequence
        for (let i = 0; i < 6; i++) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150 + Math.random() * 200, now + i * 0.08);
          gain.gain.setValueAtTime(0.15, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.05);
        }
      } else if (type === 'step') {
        // Step pop sound
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'correct') {
        // High major triad chime
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.25, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.3);
        });
      } else if (type === 'wrong') {
        // Low wrong buzzer
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'fanfare') {
        // Victory fanfare
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.12);
          gain.gain.setValueAtTime(0.3, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.4);
        });
      }
    }

    /* Subject Presets Question Database */
    const SUBJECT_PRESETS = {

        { q: "正方形的邊長為 6 cm，其面積為多少？", options: ["12 cm²", "24 cm²", "36 cm²", "48 cm²"], answer: 2, type: "question", subject: "面積計算" }
      ]
    };

    // Default Team Palette Colors
    const TEAM_COLORS = [
      { name: "紅色隊 (Red)", bg: "bg-rose-500", text: "text-rose-400", hex: "#f43f5e", border: "border-rose-500" },
      { name: "藍色隊 (Blue)", bg: "bg-sky-500", text: "text-sky-400", hex: "#0284c7", border: "border-sky-500" },
      { name: "綠色隊 (Green)", bg: "bg-emerald-500", text: "text-emerald-400", hex: "#10b981", border: "border-emerald-500" },
      { name: "黃色隊 (Yellow)", bg: "bg-amber-400", text: "text-amber-400", hex: "#f59e0b", border: "border-amber-400" },
      { name: "紫色隊 (Purple)", bg: "bg-purple-500", text: "text-purple-400", hex: "#a855f7", border: "border-purple-500" },
      { name: "橙色隊 (Orange)", bg: "bg-orange-500", text: "text-orange-400", hex: "#f97316", border: "border-orange-500" }
    ];

    /* Game State */
    let TOTAL_TILES = 22; // Start(0) -> Tiles 1..20 -> Finish(21)
    let gameQuestions = JSON.parse(JSON.stringify(SUBJECT_PRESETS.general));
    let teams = [
      { id: 0, name: "第一組 (Red)", color: TEAM_COLORS[0], position: 0, score: 0 },
      { id: 1, name: "第二組 (Blue)", color: TEAM_COLORS[1], position: 0, score: 0 },
      { id: 2, name: "第三組 (Green)", color: TEAM_COLORS[2], position: 0, score: 0 },
      { id: 3, name: "第四組 (Yellow)", color: TEAM_COLORS[3], position: 0, score: 0 }
    ];
    let currentTurnIndex = 0;
    let isRolling = false;
    let isMoving = false;
    let activeQuestionTile = null;

    /* Initialize Map Grid & App */
    window.onload = function() {
      lucide.createIcons();
      renderBoardGrid();
      updateLeaderboard();
      updateTurnUI();
      logEvent("遊戲準備就緒，請第 1 組擲骰子展開冒險！");
    };

    /* Render Game Map Tiles */
    function renderBoardGrid() {
      const gridContainer = document.getElementById('boardGrid');
      gridContainer.innerHTML = '';

      for (let i = 0; i < TOTAL_TILES; i++) {
        const tileDiv = document.createElement('div');
        tileDiv.id = `tile-${i}`;
        tileDiv.className = `relative rounded-2xl p-2 sm:p-3 min-h-[85px] sm:min-h-[100px] flex flex-col justify-between border-2 transition-all duration-300 shadow-md ${getTileStyle(i)}`;

        // Tile Header Label
        let tileTypeLabel = '';
        let tileIcon = '';

        if (i === 0) {
          tileTypeLabel = '起點 START';
          tileIcon = 'flag';
        } else if (i === TOTAL_TILES - 1) {
          tileTypeLabel = '終點 FINISH';
          tileIcon = 'trophy';
        } else {
          const qData = getQuestionForTile(i);
          if (qData.type === 'bonus') {
            tileTypeLabel = '加分格';
            tileIcon = 'gift';
          } else if (qData.type === 'shortcut') {
            tileTypeLabel = '捷徑門';
            tileIcon = 'zap';
          } else if (qData.type === 'chance') {
            tileTypeLabel = '命運格';
            tileIcon = 'sparkles';
          } else {
            tileTypeLabel = `第 ${i} 題`;
            tileIcon = 'help-circle';
          }
        }

        tileDiv.innerHTML = `
          <div class="flex items-center justify-between text-[11px] sm:text-xs font-black tracking-wider opacity-90">
            <span>#${i === 0 ? 'S' : (i === TOTAL_TILES - 1 ? 'F' : i)}</span>
            <i data-lucide="${tileIcon}" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
          </div>
          <div class="text-[10px] sm:text-xs font-bold truncate my-1">
            ${tileTypeLabel}
          </div>
          <!-- Pawns Container -->
          <div id="pawn-container-${i}" class="flex flex-wrap gap-1 items-center justify-start min-h-[22px] z-10">
            <!-- Team Pawns injected dynamically -->
          </div>
        `;

        gridContainer.appendChild(tileDiv);
      }

      lucide.createIcons();
      renderAllPawns();
    }

    function getQuestionForTile(index) {
      if (index <= 0 || index >= TOTAL_TILES - 1) return {};
      const qIndex = (index - 1) % gameQuestions.length;
      return gameQuestions[qIndex];
    }

    function getTileStyle(i) {
      if (i === 0) return 'bg-emerald-900/40 border-emerald-500/60 text-emerald-300';
      if (i === TOTAL_TILES - 1) return 'bg-amber-900/50 border-amber-400 text-amber-300 shadow-amber-500/20 shadow-lg';
      
      const qData = getQuestionForTile(i);
      if (qData.type === 'bonus') return 'bg-purple-900/30 border-purple-500/60 text-purple-300';
      if (qData.type === 'shortcut') return 'bg-cyan-900/30 border-cyan-500/60 text-cyan-300';
      if (qData.type === 'chance') return 'bg-pink-900/30 border-pink-500/60 text-pink-300';
      return 'bg-slate-800/80 border-slate-700 hover:border-indigo-500/50 text-slate-200';
    }

    /* Render Team Tokens/Pawns on Map */
    function renderAllPawns() {
      // Clear all pawn containers
      for (let i = 0; i < TOTAL_TILES; i++) {
        const container = document.getElementById(`pawn-container-${i}`);
        if (container) container.innerHTML = '';
      }

      // Append team pawns
      teams.forEach((team) => {
        const targetContainer = document.getElementById(`pawn-container-${team.position}`);
        if (targetContainer) {
          const pawn = document.createElement('div');
          pawn.className = `w-5 h-5 sm:w-6 sm:h-6 rounded-full ${team.color.bg} text-slate-950 font-black text-[10px] sm:text-xs flex items-center justify-center shadow-lg border border-white/80 pawn-anim ring-2 ring-slate-900`;
          pawn.title = `${team.name} (位置: ${team.position})`;
          pawn.innerText = team.id + 1;
          targetContainer.appendChild(pawn);
        }
      });
    }

    /* Roll Dice Controller */
    function rollDice() {
      if (isRolling || isMoving) return;
      isRolling = true;
      playSound('roll');

      const diceEl = document.getElementById('dice');
      const rollBtn = document.getElementById('rollDiceBtn');
      rollBtn.disabled = true;
      rollBtn.classList.add('opacity-50', 'cursor-not-allowed');

      // Random dice result 1-6
      const result = Math.floor(Math.random() * 6) + 1;

      // Calculate 3D Dice rotation angles
      const xRots = [0, 0, 180, 0, -90, 90];
      const yRots = [0, -90, 0, 90, 0, 0];
      const extraSpins = 4 * 360; // 4 full spins

      const targetX = xRots[result - 1] + extraSpins;
      const targetY = yRots[result - 1] + extraSpins;

      diceEl.style.transform = `rotateX(${targetX}deg) rotateY(${targetY}deg)`;

      setTimeout(() => {
        isRolling = false;
        logEvent(`${teams[currentTurnIndex].name} 擲出了 <span class="text-amber-400 font-bold">${result} 点</span>！`);
        moveCurrentTeam(result);
      }, 1100);
    }

    /* Step-by-Step Movement Logic */
    function moveCurrentTeam(steps) {
      isMoving = true;
      const team = teams[currentTurnIndex];
      let stepCount = 0;

      const moveInterval = setInterval(() => {
        if (stepCount < steps && team.position < TOTAL_TILES - 1) {
          team.position++;
          stepCount++;
          playSound('step');
          renderAllPawns();
        } else {
          clearInterval(moveInterval);
          isMoving = false;
          
          // Arrived at destination tile
          handleTileLanding(team.position);
        }
      }, 350);
    }

    /* Landing Event Controller */
    function handleTileLanding(tileIndex) {
      const currentTeam = teams[currentTurnIndex];

      // Check if finished
      if (tileIndex >= TOTAL_TILES - 1) {
        currentTeam.score += 50; // Victory bonus
        updateLeaderboard();
        triggerVictory(currentTeam);
        return;
      }

      const qData = getQuestionForTile(tileIndex);
      activeQuestionTile = tileIndex;

      // Handle Tile Types
      if (qData.type === 'bonus') {
        currentTeam.score += qData.points || 15;
        playSound('correct');
        logEvent(`${currentTeam.name} 停留在【${qData.title}】，獲得 <span class="text-emerald-400 font-bold">+${qData.points || 15} 分</span>！`);
        updateLeaderboard();
        finishTurn();
      } else if (qData.type === 'shortcut') {
        playSound('correct');
        logEvent(`${currentTeam.name} 觸發【${qData.title}】，直達第 ${qData.targetTile} 格！`);
        setTimeout(() => {
          currentTeam.position = qData.targetTile;
          renderAllPawns();
          finishTurn();
        }, 800);
      } else if (qData.type === 'chance') {
        if (qData.move) {
          currentTeam.position = Math.max(0, currentTeam.position + qData.move);
          logEvent(`${currentTeam.name} 遇到【${qData.title}】，位移 ${qData.move} 格！`);
          renderAllPawns();
        }
        if (qData.points) {
          currentTeam.score += qData.points;
          logEvent(`${currentTeam.name} 獲得【${qData.title}】獎勵 ${qData.points} 分！`);
          updateLeaderboard();
        }
        finishTurn();
      } else {
        // Standard Question Tile Popup
        openQuestionModal(qData, tileIndex);
      }
    }

    /* Open Interactive Question Modal */
    function openQuestionModal(qData, tileIndex) {
      const modal = document.getElementById('questionModal');
      const tileBadge = document.getElementById('modalTileBadge');
      const subjectBadge = document.getElementById('modalSubjectBadge');
      const rewardBadge = document.getElementById('modalScoreReward');
      const qText = document.getElementById('modalQuestionText');
      const optionsBox = document.getElementById('modalOptionsContainer');
      const feedbackBox = document.getElementById('feedbackBox');
      const confirmBtn = document.getElementById('modalConfirmBtn');

      const rewardPoints = qData.bonusPoints || 10;

      tileBadge.innerText = `第 ${tileIndex} 格 Question`;
      subjectBadge.innerText = qData.subject || "課堂問題";
      rewardBadge.innerText = `+${rewardPoints} 分`;
      qText.innerText = qData.q || "請回答問題：";

      feedbackBox.className = "hidden p-4 rounded-2xl mb-6 text-center font-bold text-base flex items-center justify-center gap-2";
      confirmBtn.classList.add('hidden');

      optionsBox.innerHTML = '';

      if (qData.options && qData.options.length > 0) {
        qData.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = "p-4 rounded-2xl bg-slate-700/80 hover:bg-slate-700 border border-slate-600 text-left font-semibold text-white transition flex items-center gap-3 active:scale-98 group";
          btn.onclick = () => submitAnswer(idx, qData.answer, rewardPoints);
          btn.innerHTML = `
            <span class="w-8 h-8 rounded-xl bg-slate-800 text-slate-300 font-bold flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition">
              ${String.fromCharCode(65 + idx)}
            </span>
            <span>${opt}</span>
          `;
          optionsBox.appendChild(btn);
        });
      }

      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modal.querySelector('div').classList.remove('scale-95');
      }, 10);
    }

    /* Submit Question Answer */
    function submitAnswer(selectedIndex, correctIndex, points) {
      const feedbackBox = document.getElementById('feedbackBox');
      const confirmBtn = document.getElementById('modalConfirmBtn');
      const optionsBox = document.getElementById('modalOptionsContainer');
      const currentTeam = teams[currentTurnIndex];

      // Disable all option buttons
      Array.from(optionsBox.children).forEach(btn => btn.disabled = true);

      if (selectedIndex === correctIndex) {
        playSound('correct');
        currentTeam.score += points;
        feedbackBox.classList.remove('hidden');
        feedbackBox.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border', 'border-emerald-500/30');
        feedbackBox.innerHTML = `<i data-lucide="check-circle-2" class="w-5 h-5"></i> 恭喜答對！獲得 +${points} 分，並可留在原格！`;
        logEvent(`${currentTeam.name} 答對第 ${activeQuestionTile} 題，得分 <span class="text-emerald-400 font-bold">+${points}</span>！`);
      } else {
        playSound('wrong');
        currentTeam.position = Math.max(0, currentTeam.position - 1); // Step back 1 penalty
        renderAllPawns();
        feedbackBox.classList.remove('hidden');
        feedbackBox.classList.add('bg-rose-500/20', 'text-rose-300', 'border', 'border-rose-500/30');
        feedbackBox.innerHTML = `<i data-lucide="x-circle" class="w-5 h-5"></i> 答錯了！退後 1 格！其他組別可進行搶答。`;
        logEvent(`${currentTeam.name} 答錯第 ${activeQuestionTile} 題，退後 1 格！`);
      }

      lucide.createIcons();
      updateLeaderboard();
      confirmBtn.classList.remove('hidden');
    }

    function closeQuestionModal() {
      const modal = document.getElementById('questionModal');
      modal.classList.add('opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
        finishTurn();
      }, 200);
    }

    /* Complete Current Turn and Advance */
    function finishTurn() {
      currentTurnIndex = (currentTurnIndex + 1) % teams.length;
      updateTurnUI();

      const rollBtn = document.getElementById('rollDiceBtn');
      rollBtn.disabled = false;
      rollBtn.classList.remove('opacity-50', 'cursor-not-allowed');
    }

    function updateTurnUI() {
      const currentTeam = teams[currentTurnIndex];
      const pawnBadge = document.getElementById('turnPawnColor');
      const teamNameText = document.getElementById('turnTeamName');

      pawnBadge.className = `w-7 h-7 rounded-full shadow-md flex items-center justify-center font-bold text-slate-950 ${currentTeam.color.bg}`;
      pawnBadge.innerText = currentTeam.id + 1;
      teamNameText.innerText = currentTeam.name;
    }

    /* Leaderboard Update Renderer */
    function updateLeaderboard() {
      const container = document.getElementById('teamScoresList');
      container.innerHTML = '';

      // Sort teams by score descending
      const sorted = [...teams].sort((a, b) => b.score - a.score);

      sorted.forEach((team, index) => {
        const item = document.createElement('div');
        const isCurrent = team.id === teams[currentTurnIndex].id;

        item.className = `p-3 rounded-2xl border transition-all flex items-center justify-between ${
          isCurrent ? 'bg-slate-700/90 border-indigo-500/80 shadow-md ring-1 ring-indigo-500/40' : 'bg-slate-900/60 border-slate-700/60'
        }`;

        item.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="text-xs font-black w-4 text-center ${index === 0 ? 'text-amber-400' : 'text-slate-500'}">
              ${index + 1}
            </span>
            <div class="w-6 h-6 rounded-full ${team.color.bg} text-slate-950 font-bold text-xs flex items-center justify-center">
              ${team.id + 1}
            </div>
            <div>
              <span class="font-bold text-sm text-white block">${team.name}</span>
              <span class="text-[10px] text-slate-400">目前位置: 第 ${team.position} 格</span>
            </div>
          </div>
          <div class="text-right">
            <span class="font-black text-base text-amber-400">${team.score}</span>
            <span class="text-[10px] text-slate-400 block">PTS</span>
          </div>
        `;

        container.appendChild(item);
      });
    }

    function logEvent(msg) {
      const gameLog = document.getElementById('gameLog');
      const entry = document.createElement('p');
      entry.className = "leading-relaxed border-b border-slate-800/80 pb-1";
      entry.innerHTML = `<span class="text-slate-500 text-[10px]">[${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}]</span> ${msg}`;
      gameLog.appendChild(entry);
      gameLog.scrollTop = gameLog.scrollHeight;
    }

    /* Trigger Victory Modal and Confetti */
    function triggerVictory(winnerTeam) {
      playSound('fanfare');
      
      // Fire particle confetti
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });

      const modal = document.getElementById('victoryModal');
      document.getElementById('winnerTeamText').innerText = `🎉 ${winnerTeam.name} 榮獲知識大冒險總冠軍！`;

      const summaryBox = document.getElementById('victoryScoresSummary');
      summaryBox.innerHTML = '<p class="text-xs font-bold uppercase text-slate-400 mb-2">最終積分排行榜</p>';

      const sorted = [...teams].sort((a, b) => b.score - a.score);
      sorted.forEach((t, i) => {
        summaryBox.innerHTML += `
          <div class="flex justify-between items-center text-sm">
            <span class="text-slate-300">${i + 1}. ${t.name}</span>
            <span class="font-bold text-amber-400">${t.score} 分</span>
          </div>
        `;
      });

      modal.classList.remove('hidden');
    }

    /* Team Setup Modal Handlers */
    function openTeamSetupModal() {
      const container = document.getElementById('teamNameInputs');
      container.innerHTML = '';

      teams.forEach((team, idx) => {
        container.innerHTML += `
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-full ${team.color.bg} text-slate-950 font-bold text-xs flex items-center justify-center shrink-0">${idx + 1}</div>
            <input type="text" id="teamInputName-${idx}" value="${team.name}" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-sm text-white w-full focus:outline-none focus:border-indigo-500">
          </div>
        `;
      });

      document.getElementById('teamCountRange').value = teams.length;
      document.getElementById('teamCountDisplay').innerText = teams.length;
      document.getElementById('teamSetupModal').classList.remove('hidden');
    }

    function closeTeamSetupModal() {
      document.getElementById('teamSetupModal').classList.add('hidden');
    }

    function updateTeamCountInput(val) {
      document.getElementById('teamCountDisplay').innerText = val;
      const count = parseInt(val);
      const container = document.getElementById('teamNameInputs');
      container.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const existingName = teams[i] ? teams[i].name : `第 ${i + 1} 組`;
        const color = TEAM_COLORS[i % TEAM_COLORS.length];
        container.innerHTML += `
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-full ${color.bg} text-slate-950 font-bold text-xs flex items-center justify-center shrink-0">${i + 1}</div>
            <input type="text" id="teamInputName-${i}" value="${existingName}" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-sm text-white w-full focus:outline-none focus:border-indigo-500">
          </div>
        `;
      }
    }

    function applyTeamSettings() {
      const count = parseInt(document.getElementById('teamCountRange').value);
      const newTeams = [];

      for (let i = 0; i < count; i++) {
        const inputVal = document.getElementById(`teamInputName-${i}`).value.trim();
        newTeams.push({
          id: i,
          name: inputVal || `第 ${i + 1} 組`,
          color: TEAM_COLORS[i % TEAM_COLORS.length],
          position: teams[i] ? teams[i].position : 0,
          score: teams[i] ? teams[i].score : 0
        });
      }

      teams = newTeams;
      if (currentTurnIndex >= teams.length) currentTurnIndex = 0;

      updateTurnUI();
      updateLeaderboard();
      renderAllPawns();
      closeTeamSetupModal();
      logEvent("已更新隊伍設定！");
    }

    /* Question Editor Modal Handlers */
    function openQuestionEditor() {
      renderQuestionEditorList();
      document.getElementById('questionEditorModal').classList.remove('hidden');
    }

    function closeQuestionEditor() {
      document.getElementById('questionEditorModal').classList.add('hidden');
    }

    function loadSubjectPreset(presetKey) {
      if (SUBJECT_PRESETS[presetKey]) {
        gameQuestions = JSON.parse(JSON.stringify(SUBJECT_PRESETS[presetKey]));
        renderQuestionEditorList();
        renderBoardGrid();
        logEvent(`已成功載入「${document.getElementById('presetSubjectSelect').options[document.getElementById('presetSubjectSelect').selectedIndex].text}」題庫！`);
      }
    }

    function renderQuestionEditorList() {
      const container = document.getElementById('editorQuestionList');
      container.innerHTML = '';

      gameQuestions.forEach((q, idx) => {
        const isQ = q.type === 'question' || !q.type;
        const card = document.createElement('div');
        card.className = "bg-slate-900/80 border border-slate-700 p-4 rounded-2xl space-y-2";

        card.innerHTML = `
          <div class="flex justify-between items-center text-xs font-bold text-amber-400">
            <span>題目位置 #${idx + 1} (${q.type || '一般題'})</span>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-400 block mb-1">題目內容 Question Text</label>
            <input type="text" id="edit-q-${idx}" value="${q.q || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-sm text-white focus:outline-none">
          </div>
          ${isQ ? `
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[11px] text-slate-400 block">選項 A</label>
                <input type="text" id="edit-opt-${idx}-0" value="${q.options ? q.options[0] : ''}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white">
              </div>
              <div>
                <label class="text-[11px] text-slate-400 block">選項 B</label>
                <input type="text" id="edit-opt-${idx}-1" value="${q.options ? q.options[1] : ''}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white">
              </div>
              <div>
                <label class="text-[11px] text-slate-400 block">選項 C</label>
                <input type="text" id="edit-opt-${idx}-2" value="${q.options ? q.options[2] : ''}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white">
              </div>
              <div>
                <label class="text-[11px] text-slate-400 block">選項 D</label>
                <input type="text" id="edit-opt-${idx}-3" value="${q.options ? q.options[3] : ''}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white">
              </div>
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    function saveCustomQuestions() {
      gameQuestions.forEach((q, idx) => {
        const qInput = document.getElementById(`edit-q-${idx}`);
        if (qInput) q.q = qInput.value;

        if (q.options) {
          for (let i = 0; i < 4; i++) {
            const optInput = document.getElementById(`edit-opt-${idx}-${i}`);
            if (optInput) q.options[i] = optInput.value;
          }
        }
      });

      renderBoardGrid();
      closeQuestionEditor();
      logEvent("已自訂題庫並更新地圖！");
    }

    /* Restart Game Logic */
    function restartGameConfirm() {
      if (confirm("確定要重新開始遊戲嗎？隊伍分數與位置將歸零。")) {
        restartGame();
      }
    }

    function restartGame() {
      teams.forEach(t => {
        t.position = 0;
        t.score = 0;
      });
      currentTurnIndex = 0;
      isRolling = false;
      isMoving = false;

      document.getElementById('victoryModal').classList.add('hidden');
      updateTurnUI();
      updateLeaderboard();
      renderAllPawns();
      logEvent("遊戲已重置，開啟全新大冒險！");
    }
  </script>
</body>
</html>
